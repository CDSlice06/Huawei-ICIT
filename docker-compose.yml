services:
  # 前端进 Nginx：Docker 多阶段构建（tasks.md 决策记录2）
  # node:20 阶段 npm ci && npm run build 产出 dist → nginx:1.24 阶段 COPY 进镜像，
  # 一键 `docker compose up -d --build` 无宿主机 Node 依赖；nginx 配置挂载 deploy/nginx.conf
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: memweave-frontend:latest
    container_name: memweave-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: memweave-backend:latest
    container_name: memweave-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: memweave-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
